name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer, phpcs, phpcbf
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, libxml, openssl, pdo, phar, posix, session, simplexml, sqlite3, tokenizer, xmlreader, xmlwriter, zip, zlib
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Install PHP_CodeSniffer
      run: composer global require squizlabs/php_codesniffer

    - name: Fix PSR-4 Autoloading
      run: |
        mkdir -p app/Http/Controllers/Auth
        mv app/Http/Controllers/RegisteredUserController.php app/Http/Controllers/Auth/
        mv app/Http/Controllers/UserController.php app/Http/Controllers/Private/

    - name: Fix Coding Style Issues
      run: ~/.composer/vendor/bin/phpcbf --standard=PSR12 app tests || true

    - name: Install Node.js Dependencies
      run: npm install

    - name: Run PHP Code Sniffer
      run: ~/.composer/vendor/bin/phpcs --standard=PSR12 --ignore=tests/Pest.php app tests

    - name: Run Tests
      run: vendor/bin/pest 