name: Code Style Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs, phpcbf
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Fix code style issues
        run: |
          echo "Fixing code style issues..."
          phpcbf --standard=PSR12 app tests

      - name: Run PHPCS
        run: |
          echo "Current directory: $(pwd)"
          echo "PHPCS version:"
          phpcs --version
          echo "Running PHPCS..."
          phpcs --standard=PSR12 app tests 